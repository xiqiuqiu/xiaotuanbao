name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.15.1"
  POSTGRES_USER: xiaotuanbao
  POSTGRES_PASSWORD: ci-please-change-this-password
  POSTGRES_DB: xiaotuanbao

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Web-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'packages/ai-contracts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/verify.yml'

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @xiaotuanbao/shared build && pnpm --filter @xiaotuanbao/ai-contracts build

      # prisma generate needs a .env for dotenv-cli; DB need not be reachable.
      - name: Write CI .env
        run: cp .env.example .env

      - name: Prisma generate
        run: pnpm --filter api prisma:generate

      - name: Typecheck
        run: pnpm typecheck

  unit-tests-core:
    name: unit-tests-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @xiaotuanbao/shared build && pnpm --filter @xiaotuanbao/ai-contracts build

      - name: Write CI .env
        run: cp .env.example .env

      - name: Prisma generate
        run: pnpm --filter api prisma:generate

      - name: Core unit tests
        run: pnpm test:unit:core:ci

  web-unit-tests:
    name: web-unit-tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Web unit tests
        run: pnpm --filter web exec vitest run --shard=${{ matrix.shard }}/4

  unit-tests:
    name: unit-tests
    if: always()
    needs: [changes, unit-tests-core, web-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check unit-test gates
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CORE_RESULT: ${{ needs.unit-tests-core.result }}
          WEB_RESULT: ${{ needs.web-unit-tests.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$CORE_RESULT" = "success"
          test "$WEB_RESULT" = "success" -o "$WEB_RESULT" = "skipped"

  api-e2e:
    name: api-e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xiaotuanbao -d xiaotuanbao"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @xiaotuanbao/shared build && pnpm --filter @xiaotuanbao/ai-contracts build

      - name: Write CI .env
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^JWT_SECRET=.*|JWT_SECRET=ci-jwt-secret-not-for-production|' \
            -e "s|^POSTGRES_USER=.*|POSTGRES_USER=${POSTGRES_USER}|" \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${POSTGRES_PASSWORD}|" \
            -e "s|^POSTGRES_DB=.*|POSTGRES_DB=${POSTGRES_DB}|" \
            -e "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?schema=public\&connection_limit=20\&pool_timeout=60|" \
            .env

      # Real S3-compatible backend required for FileStore e2e (ADR-0027 / #156). No local-disk fallback.
      - name: Start Garage
        run: |
          set -euo pipefail
          source .env
          docker run -d --name xiaotuanbao-garage-ci \
            -p 3900:3900 \
            -v "${GITHUB_WORKSPACE}/docker/garage/garage.toml:/etc/garage.toml:ro" \
            -e "GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY}" \
            -e "GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_KEY}" \
            -e "GARAGE_DEFAULT_BUCKET=${S3_BUCKET}" \
            dxflrs/garage:v2.3.0 \
            /garage server --single-node --default-bucket
          for i in $(seq 1 30); do
            if docker exec xiaotuanbao-garage-ci /garage status >/dev/null 2>&1; then
              echo "Garage is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs xiaotuanbao-garage-ci || true
          echo "Garage failed to become ready" >&2
          exit 1

      - name: Prisma generate
        run: pnpm --filter api prisma:generate

      - name: Migrate
        run: pnpm --filter api prisma:migrate:deploy

      - name: Seed
        run: pnpm --filter api prisma:db:seed

      - name: API e2e (CI scope)
        env:
          # Jest --runInBand keeps the whole suite in one process. After #366 the
          # default ~2GB heap OOMs on ubuntu-latest even when every spec passed.
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:e2e:ci
