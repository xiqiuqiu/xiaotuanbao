name: Deploy Home

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image / git tag to build and deploy (e.g. v0.1.0 or main)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/xiqiuqiu/xiaotuanbao-api
  IMAGE_WEB: ghcr.io/xiqiuqiu/xiaotuanbao-web
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'armbian' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      git_ref: ${{ steps.meta.outputs.git_ref }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
    steps:
      - id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.image_tag }}"
            echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "git_ref=${TAG}" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == v* ]]; then
              echo "push_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "push_latest=false" >> "$GITHUB_OUTPUT"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "git_ref=${TAG}" >> "$GITHUB_OUTPUT"
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            image: ghcr.io/xiqiuqiu/xiaotuanbao-api
            file: apps/api/Dockerfile
          - name: web
            image: ghcr.io/xiqiuqiu/xiaotuanbao-web
            file: apps/web/Dockerfile
            target: export
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.git_ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.image_tag }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ needs.resolve.outputs.push_latest == 'true' }}

      - name: Build and push API
        if: matrix.name == 'api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Build and push Web
        if: matrix.name == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_NAME=小团宝
            VITE_API_BASE_URL=/api
            VITE_APP_ENV=production
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: [resolve, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.DEPLOY_HOST }}

      - name: Deploy over SSH
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          GIT_REF: ${{ needs.resolve.outputs.git_ref }}
          HOST: ${{ env.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            "root@${HOST}" \
            "cd /mnt/mydata/xiaotuanbao && tmp_docker_config=\$(mktemp -d) && trap 'rm -rf \"\$tmp_docker_config\"' EXIT && export DOCKER_CONFIG=\"\$tmp_docker_config\" && docker login ghcr.io -u '${GHCR_USER}' --password-stdin >/dev/null && perl -0pi -e 's/\r\n/\n/g' ./scripts/remote-deploy-home.sh && IMAGE_TAG='${IMAGE_TAG}' GIT_REF='${GIT_REF}' ./scripts/remote-deploy-home.sh"
