services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: export
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-小团宝}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    container_name: xiaotuanbao-web
    restart: "no"
    volumes:
      - web_dist:/output

  caddy:
    image: caddy:2
    container_name: xiaotuanbao-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${CADDY_DOMAIN:-:80}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - web_dist:/srv/web
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      agent:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: xiaotuanbao-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-xiaotuanbao}:${POSTGRES_PASSWORD:-please-change-this-password}@postgres:5432/${POSTGRES_DB:-xiaotuanbao}?schema=public
      # Compose network: talk to Garage by service name (host .env may use 127.0.0.1:3900).
      S3_ENDPOINT: http://garage:3900
      AGENT_RUNTIME_URL: /copilotkit
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    volumes:
      # Legacy UPLOAD_DIR mount; new attachments use FileStore/S3 (ADR-0027).
      - ./uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    container_name: xiaotuanbao-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AGENT_PORT: 4111
      API_BASE_URL: http://api:3000
      AGENT_SERVICE_SECRET: ${AGENT_SERVICE_SECRET:-dev-agent-service-secret-change-me}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AI_MODEL: ${AI_MODEL:-deepseek/deepseek-chat}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      COPILOTKIT_TELEMETRY_DISABLED: ${COPILOTKIT_TELEMETRY_DISABLED:-true}
    depends_on:
      api:
        condition: service_healthy

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: xiaotuanbao-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "3900:3900"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:-GKaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-xiaotuanbao}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - ./garage/data:/var/lib/garage

  postgres:
    image: postgres:16
    container_name: xiaotuanbao-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xiaotuanbao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-please-change-this-password}
      POSTGRES_DB: ${POSTGRES_DB:-xiaotuanbao}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xiaotuanbao} -d ${POSTGRES_DB:-xiaotuanbao}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  web_dist:
